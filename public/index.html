<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Fake News Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: #090d16;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .input-group {
      margin-bottom: 24px;
    }

    textarea {
      width: 100%;
      height: 180px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: #f1f5f9;
      padding: 18px;
      font-size: 1rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: all 0.2s ease;
    }

    textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    textarea::placeholder {
      color: #475569;
    }

    .btn-action {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-action:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
    }

    .btn-action:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result-card {
      margin-top: 28px;
      padding: 20px;
      border-radius: 16px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-card.fake {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .result-card.real {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }

    .result-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-desc {
      font-size: 0.88rem;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="badge">✨ NLP & Machine Learning</div>
      <h1>AI Fake News Detector</h1>
      <p class="subtitle">Paste news article content below to verify its authenticity instantly.</p>
    </div>

    <div class="input-group">
      <textarea id="newsInput" placeholder="Paste article text here..."></textarea>
    </div>

    <button class="btn-action" onclick="analyzeNews()" id="submitBtn">
      <span>Analyze Content</span>
    </button>

    <div id="resultCard" class="result-card">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-desc" id="resultDesc"></div>
    </div>
  </div>

  <script>
    async function analyzeNews() {
      const text = document.getElementById('newsInput').value.trim();
      const resultCard = document.getElementById('resultCard');
      const resultTitle = document.getElementById('resultTitle');
      const resultDesc = document.getElementById('resultDesc');
      const btn = document.getElementById('submitBtn');

      if (!text) {
        alert('Please enter text to analyze.');
        return;
      }

      btn.innerText = 'Processing...';
      btn.disabled = true;
      resultCard.style.display = 'none';

      // Live Server (5500) se direct Python Flask (5001) ko target karein
      const isLocal = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
      const apiUrl = isLocal ? 'http://127.0.0.1:5001/predict' : '/api/predict';

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });

        const data = await response.json();
        btn.innerText = 'Analyze Content';
        btn.disabled = false;

        if (data.error) {
          alert('Backend Error: ' + data.error);
          return;
        }

        resultCard.style.display = 'block';
        if (data.prediction === 'Fake News') {
          resultCard.className = 'result-card fake';
          resultTitle.innerHTML = '🚨 Warning: Fake News Detected';
          resultDesc.innerText = 'The model identified patterns typical of unverified or misleading news content.';
        } else {
          resultCard.className = 'result-card real';
          resultTitle.innerHTML = '✅ Verified: Real News Content';
          resultDesc.innerText = 'The analyzed text displays linguistic structure consistent with authentic reporting.';
        }
      } catch (err) {
        btn.innerText = 'Analyze Content';
        btn.disabled = false;
        alert('API Call Failed: ' + err.message);
      }
    }
  </script>
</body>
</html>
