<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Fake News Detector</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: #1e293b;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      color: #ffffff;
      text-align: center;
    }
    p.subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 25px;
    }
    textarea {
      width: 100%;
      height: 180px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 15px;
      color: #f8fafc;
      font-size: 1rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus {
      border-color: #6366f1;
    }
    button {
      width: 100%;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }
    button:hover {
      background: #4338ca;
    }
    button:disabled {
      background: #334155;
      cursor: not-allowed;
    }
    .result-card {
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }
    .result-card.fake {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
    .result-card.real {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #86efac;
    }
    .result-card h3 {
      font-size: 1.25rem;
      margin-bottom: 6px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div style="text-align: center;">
      <span class="badge">✨ NLP & Machine Learning</span>
    </div>
    <h1>AI Fake News Detector</h1>
    <p class="subtitle">Paste news article content below to verify its authenticity instantly.</p>

    <textarea id="newsInput" placeholder="Paste news article text here..."></textarea>
    <button id="submitBtn" onclick="analyzeNews()">Analyze Content</button>

    <div id="resultCard" class="result-card">
      <h3 id="resultTitle"></h3>
      <p id="resultDesc"></p>
    </div>
  </div>

  <script>
    async function analyzeNews() {
      const text = document.getElementById('newsInput').value.trim();
      const resultCard = document.getElementById('resultCard');
      const resultTitle = document.getElementById('resultTitle');
      const resultDesc = document.getElementById('resultDesc');
      const btn = document.getElementById('submitBtn');

      if (!text) {
        alert('Please enter text to analyze.');
        return;
      }

      btn.innerText = 'Processing...';
      btn.disabled = true;
      resultCard.style.display = 'none';

      // Live Render API URL
      const apiUrl = 'https://fake-news-detector-wo4y.onrender.com/predict';

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });

        const data = await response.json();
        btn.innerText = 'Analyze Content';
        btn.disabled = false;

        if (data.error) {
          alert('Backend Error: ' + data.error);
          return;
        }

        resultCard.style.display = 'block';
        if (data.prediction === 'Fake News') {
          resultCard.className = 'result-card fake';
          resultTitle.innerHTML = '🚨 Warning: Fake News Detected';
          resultDesc.innerText = 'The model identified patterns typical of unverified or misleading news content.';
        } else {
          resultCard.className = 'result-card real';
          resultTitle.innerHTML = '✅ Verified: Real News Content';
          resultDesc.innerText = 'The analyzed text displays linguistic structure consistent with authentic reporting.';
        }
      } catch (err) {
        btn.innerText = 'Analyze Content';
        btn.disabled = false;
        alert('API Call Failed: ' + err.message);
      }
    }
  </script>

</body>
</html>
